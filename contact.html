<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Shraddha Bijukchhe | 2026-03-12 -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wild Rescues | Contact</title>

    <meta
      name="description"
      content="Contact Wild Rescues to volunteer, report injured wildlife, or learn how you can support our wildlife rescue organization."
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-brown">
      <div class="container">
        <a class="navbar-brand" href="index.html">🐾 Wild Rescues</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="partnership.html">Partnership</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="faqs.html">FAQs</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Header -->
    <header class="bg-brown text-white text-center p-5">
      <h1>Contact Wild Rescues</h1>
      <p>We would love to hear from you</p>
    </header>

    <!-- Main Content -->
    <main class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h2 class="text-center mb-4">Send Us a Message</h2>

          <form>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="5" required></textarea>
            </div>

            <div class="text-center">
              <button type="submit" class="btn bg-brown text-white">
                Send Message
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brown text-center text-white p-5 mt-5">
      <p>&copy; 2026 Wild Rescues. All rights reserved.</p>

      <a href="https://www.facebook.com" target="_blank">
        <img
          src="https://cdn-icons-png.flaticon.com/512/733/733547.png"
          alt="Facebook"
          class="social-icon"
        />
      </a>

      <a href="https://www.instagram.com" target="_blank">
        <img
          src="https://cdn-icons-png.flaticon.com/512/733/733558.png"
          alt="Instagram"
          class="social-icon"
        />
      </a>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>
  </body>
</html>
